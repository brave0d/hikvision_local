update_snapshot:
  name: Update snapshot
  description: Update the snapshot file in an image entity. Used by take_pictures_on_motion_detection blueprint.
  target:
    entity:
      domain: image
      integration: hikvision_local
  fields:
    filename:
      required: true
      name: Filename
      description: The filename of the snapshot to display.
      example: "/media/hikvision_local/snapshots/2024-08/07/2024-08-07__11-54-19__camera01.jpg"
      selector:
        text:

reboot:
  name: Reboot
  description: Reboot the device.
  fields:
    config_entry_id:
      required: true
      name: "Device"
      description: "Permission needed  - Remote: Shutdown/Reboot"
      selector:
        config_entry:
          integration: hikvision_local

isapi_request:
  name: ISAPI request
  description: "Send a custom ISAPI request to the device."
  fields:
    config_entry_id:
      required: true
      name: "Device"
      description: "The Hikvision device."
      selector:
        config_entry:
          integration: hikvision_local
    method:
      required: true
      name: "HTTP method"
      description: "WARNING: You do POST and PUT at your own risk!"
      default: GET
      selector:
        select:
          mode: dropdown
          options:
            - GET
            - POST
            - PUT
    path:
      required: true
      name: "ISAPI path"
      description: "The ISAPI endpoint to request. Example: /System/deviceInfo"
      selector:
        text:
    payload:
      required: false
      name: "Request payload"
      description: "XML data"
      selector:
        text:
          multiline: true

ptz_move:
  name: PTZ move
  description: "Move a PTZ camera. Permission needed - Remote: PTZ Control"
  target:
    entity:
      domain: camera
      integration: hikvision_local
  fields:
    direction:
      name: Direction
      description: "Move in a direction at half speed. Ignored when pan, tilt or zoom is set."
      selector:
        select:
          options:
            - up
            - down
            - left
            - right
            - up_left
            - up_right
            - down_left
            - down_right
            - zoom_in
            - zoom_out
    pan:
      name: Pan speed
      description: "-100 (left) to 100 (right)."
      selector:
        number:
          min: -100
          max: 100
    tilt:
      name: Tilt speed
      description: "-100 (down) to 100 (up)."
      selector:
        number:
          min: -100
          max: 100
    zoom:
      name: Zoom speed
      description: "-100 (zoom out) to 100 (zoom in). Zoom and pan/tilt are separate movements."
      selector:
        number:
          min: -100
          max: 100
    duration:
      name: Duration
      description: "Milliseconds to move before stopping. 0 keeps moving until PTZ stop."
      default: 1000
      selector:
        number:
          min: 0
          max: 60000
          unit_of_measurement: ms

ptz_stop:
  name: PTZ stop
  description: "Stop a PTZ camera's movement."
  target:
    entity:
      domain: camera
      integration: hikvision_local

ptz:
  name: PTZ (ONVIF style)
  description: "Move a PTZ camera with the same fields as the ONVIF PTZ action, as used by Advanced Camera Card."
  target:
    entity:
      domain: camera
      integration: hikvision_local
  fields:
    pan:
      name: Pan
      selector:
        select:
          options:
            - LEFT
            - RIGHT
    tilt:
      name: Tilt
      selector:
        select:
          options:
            - UP
            - DOWN
    zoom:
      name: Zoom
      selector:
        select:
          options:
            - ZOOM_IN
            - ZOOM_OUT
    distance:
      name: Distance
      description: "Accepted for compatibility and ignored: Hikvision continuous moves have no distance."
      selector:
        number:
          min: 0
          max: 1
          step: 0.01
    speed:
      name: Speed
      default: 0.5
      selector:
        number:
          min: 0
          max: 1
          step: 0.01
    continuous_duration:
      name: Duration
      description: "Seconds to move before stopping. 0 keeps moving until move mode Stop."
      default: 0.5
      selector:
        number:
          min: 0
          max: 60
          step: 0.1
          unit_of_measurement: s
    preset:
      name: Preset
      description: "Preset number for move mode GotoPreset."
      selector:
        number:
          min: 1
          max: 300
    move_mode:
      name: Move mode
      default: ContinuousMove
      selector:
        select:
          options:
            - ContinuousMove
            - GotoPreset
            - Stop
